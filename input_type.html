<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Input Types Example</h2>
    <form>
        <label>Enter name</label>
        <input type="text" placeholder="Enter name" />


        <label>Enter email</label>
        <input type="text" placeholder="Enter email" />
        <br><br>

        <label>Adhar number</label>
        <input type="text" placeholder="Adhar number" />

        <label>Enter password</label>
        <input type="password" placeholder="Enter password" />

        <br><br>

        <label>Enter DOB</label>
        <input type="Date" />

        <label>Enter Month</label>
        <input type="Month" />
        <br><br>
        <label>Enter week</label>
        <input type="Week" />

        <label>Enter time</label>
        <input type="time" />
        <br><br>
        <label>Enter Date and Time</label>
        <input type="datetime-local" />
        <br>
        <label>choose Cities</label>
        <input type="checkbox" />Mumbai
        <input type="checkbox" />Delhi
        <input type="checkbox" />chennai
        <input type="checkbox" />wadsa
        <br>
        <br>
        <label>Select gender </label><br>
        <input type="radio" name="gender" />male
        <input type="radio" name="gender" />female
        <input type="radio" name="gender" />other

        <label>Select colour</label>
        <input type="color">
        <br><br>
        <label>Select range</label>
        <input type="range">
        <br><br>
        <label>Upload Docs</label>
        <input type="file" multiple>
        <br><br><br><br>
        <label>search </label>
        <input type="search" placeholder="type here to search">
        <label>enter url</label>
        <input type="url" placeholder="https:/example.com" />
        <label>enter telephone</label>
        <input type="tel" placeholder="9857423185">
        <br><br>
        <label>selct city</label>
        <select>
            <option>choose your city</option>
            <option>wadsa</option>
            <option>brmpuri</option>
            <option>gad</option>
            <option>hyderbad</option>
        </select>
        <br><br>
        <br><label for="">enter Address</label>
        <textarea rows="5" cols="25">wadsa gadchiroli</textarea>
        <br><br>

        <input type="submit" value="submit form">
        <input type="button" value="submit form">
        <input type="Reset" value="Reset form">
        <br><br><br>

    </form>
</body>

</html>
